name: Feature request
description: An idea for the site, the CLI flow, the prompts or the project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Start with the need, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried or considered instead?
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I would be happy to open a pull request for this
